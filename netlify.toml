# Alle Dateien liegen flach im Repository. Beim Deploy legt Netlify die Ordner selbst an.
[build]
  command = "mkdir -p dist netlify/functions && cp index.html dist/ && cp api.mjs netlify/functions/api.mjs"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
